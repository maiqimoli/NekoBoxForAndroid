name: Continuous Integration

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_COMPILE_SDK: "36"
  GO_VERSION: "1.26.6"
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify repository and Gradle wrapper
        run: bash buildScript/verify_ci_inputs.sh

  libcore:
    name: Native build and checks
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          cache-dependency-path: libcore/go.sum
          go-version: ${{ env.GO_VERSION }}

      - name: Install Android SDK components
        run: >-
          sdkmanager
          "platforms;android-${ANDROID_COMPILE_SDK}"
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          "ndk;${NDK_VERSION}"

      - name: Restore native library cache
        id: libcore-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/libs/libcore.aar
          key: >-
            libcore-${{ runner.os }}-java${{ env.JAVA_VERSION }}-go${{ env.GO_VERSION }}-${{
            env.ANDROID_COMPILE_SDK }}-bt${{ env.ANDROID_BUILD_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-${{
            hashFiles('run', 'libcore/**/*.go', 'libcore/go.mod', 'libcore/go.sum',
            'libcore/*.sh', 'buildScript/init/**/*.sh', 'buildScript/lib/core.sh',
            'buildScript/lib/core/**/*') }}

      - name: Checkout pinned native sources
        run: bash buildScript/lib/core/get_source.sh

      - name: Build native library
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        run: ./run lib core

      - name: Verify native 16 KB alignment
        run: bash buildScript/check_elf_alignment.sh app/libs/libcore.aar

      - name: Run Go tests
        working-directory: libcore
        run: go test ./...

      - name: Scan Go dependencies
        working-directory: libcore
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: libcore-aar
          path: app/libs/libcore.aar
          retention-days: 1

  android:
    name: Android unit tests, lint, and debug build
    needs: libcore
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            nb4a.properties
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK components
        run: >-
          sdkmanager
          "platforms;android-${ANDROID_COMPILE_SDK}"
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          "ndk;${NDK_VERSION}"
          "emulator"
          "platform-tools"
          "system-images;android-35;aosp_atd;x86_64"

      - name: Download native library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: libcore-aar
          path: app/libs

      - name: Test, lint, and build all debug flavors
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' "$ANDROID_HOME" "$ANDROID_HOME" "$NDK_VERSION" > local.properties
          ./run init action gradle
          ./gradlew --no-daemon \
            app:testOssDebugUnitTest \
            app:lintOssDebug \
            app:testFdroidDebugUnitTest \
            app:lintFdroidDebug \
            app:testPlayDebugUnitTest \
            app:lintPlayDebug \
            app:assembleOssDebug \
            app:assembleFdroidDebug \
            app:assemblePlayDebug

      - name: Build unsigned OSS release with R8
        env:
          BUILD_PLUGIN: none
        run: ./gradlew --no-daemon app:assembleOssRelease

      - name: Run Room migration instrumentation tests
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail
          readonly avd_name="nb4a-ci-api-35"
          readonly system_image="system-images;android-35;aosp_atd;x86_64"
          readonly emulator_log="$RUNNER_TEMP/android-emulator.log"

          printf 'no\n' | avdmanager create avd \
            --force \
            --name "$avd_name" \
            --package "$system_image" \
            --device pixel_2

          "$ANDROID_HOME/emulator/emulator" \
            -avd "$avd_name" \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$emulator_log" 2>&1 &
          emulator_pid=$!

          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb wait-for-device
          if ! timeout 300 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            cat "$emulator_log" >&2
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew --no-daemon app:connectedOssDebugAndroidTest

      - name: Verify release signing contracts
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail

          missing_log="$RUNNER_TEMP/missing-release-signing.log"
          if ./gradlew --no-daemon -PrequireReleaseSigning=true app:tasks > "$missing_log" 2>&1; then
            echo "Release signing unexpectedly succeeded without credentials" >&2
            exit 1
          fi
          if ! grep -Fq "Release signing is required" "$missing_log"; then
            cat "$missing_log" >&2
            echo "Release signing failed for an unexpected reason" >&2
            exit 1
          fi

          contract_keystore="$RUNNER_TEMP/signing-contract.keystore"
          : > "$contract_keystore"
          conflict_log="$RUNNER_TEMP/debug-signing-conflict.log"
          if KEYSTORE_PATH="$contract_keystore" \
             KEYSTORE_PASS=placeholder \
             ALIAS_NAME=placeholder \
             ALIAS_PASS=placeholder \
             ./gradlew --no-daemon -PrequireReleaseSigning=true -PsignWithDebug=true app:tasks \
             > "$conflict_log" 2>&1; then
            echo "Debug signing unexpectedly overrode required release signing" >&2
            exit 1
          fi
          if ! grep -Fq "signWithDebug cannot be used when release signing is required" "$conflict_log"; then
            cat "$conflict_log" >&2
            echo "Debug signing conflict failed for an unexpected reason" >&2
            exit 1
          fi

      - name: Verify build archives exclude signing material
        run: bash buildScript/verify_ci_inputs.sh --archives app/build/outputs/apk

      - name: Verify debug APK signatures and alignment
        run: |
          set -euo pipefail
          readonly apk_dir="app/build/outputs/apk/oss/debug"
          readonly apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          readonly zipalign="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/zipalign"

          mapfile -d '' apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print0 | sort -z)
          if (( ${#apks[@]} == 0 )); then
            echo "No debug APKs found in $apk_dir" >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
            bash buildScript/check_elf_alignment.sh "$apk"
            "$zipalign" -c -P 16 -v 4 "$apk"
          done
